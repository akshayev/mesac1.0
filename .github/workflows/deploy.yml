# Builds the site from live Google Drive + Google Sheet data and deploys it to Cloudflare Workers.
#
#   - on every push to main
#   - every night at 20:30 UTC (= 02:00 IST) so edits made in Drive/Sheets show up by the next morning
#   - on demand: GitHub -> Actions -> "Build and deploy" -> Run workflow ("Refresh now")
#
# It refuses to deploy sample data: `check:deploy` fails the run if the Drive or Sheet report still says
# "source": "fixture", or if SITE_URL is missing. Nothing is committed back to the repository.
#
# The admin dashboard (Cloudflare D1 + R2 + Access) is optional. Only when the D1_DATABASE_ID secret is set
# does the build add the database bindings and this workflow apply the database migrations and add the
# first admins before deploying. Without it the site runs from the Google Sheet as before. The public alumni
# form additionally needs the TURNSTILE_SITE_KEY variable and the TURNSTILE_SECRET_KEY and SUBMISSION_SALT secrets.
# See docs/OWNER-DEPLOYMENT-GUIDE.md.
# Secret names are listed in HANDOVER.md.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow a large drop in files or Sheet rows (tick only after deleting a lot on purpose)"
        type: boolean
        default: false
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

# Two runs never overlap; a second run waits for the first to finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs from other branches must not publish the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The mirrored question-paper PDFs live in .cache. Keying on the ISO week means they are
      # re-downloaded about once a week instead of every night (changed files are still detected by the script).
      - name: Get the current week
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the PDF mirror cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: drive-mirror-${{ steps.week.outputs.key }}
          restore-keys: |
            drive-mirror-

      # The data guards compare against the last *successful* run (a Drive crawl or Sheet tab that suddenly has less
      # than half its entries fails the build). actions/cache only saves at the end of a successful job, so this
      # restores the most recent good snapshot. It holds public data only (no secrets).
      - name: Restore the last good data snapshot
        uses: actions/cache@v4
        with:
          path: |
            data/drive-files.json
            src/data/generated/team.json
            src/data/generated/achievements.json
            src/data/generated/placements.json
            src/data/generated/alumni.json
            src/data/generated/settings.json
          key: last-good-data-${{ github.run_id }}
          restore-keys: |
            last-good-data-

      - name: Run data and parser tests
        run: npm run test:data

      # Optional features: the admin dashboard (D1_DATABASE_ID) and the public alumni form (Turnstile + salt).
      # Fails if one is only partly set up; records d1=true/false and submissions=true/false. Prints no values.
      - name: Check which optional features are configured
        id: features
        run: node scripts/check-features.mjs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUBMISSION_SALT: ${{ secrets.SUBMISSION_SALT }}

      # `npm run build` first runs the "prebuild" step: it crawls Drive, fetches the Sheet tabs and writes
      # the sitemap, then builds the site. DEPLOY=1 turns on the data guards: the run fails if a secret is
      # missing, a Sheet tab cannot be fetched, or Drive/Sheet data shrank by more than half.
      - name: Build
        run: npm run build
        env:
          DEPLOY: "1"
          ARCHIVE_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
          SHEET_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
          SHEET_TEAM_CSV: ${{ secrets.SHEET_TEAM_CSV }}
          SHEET_ACHIEVEMENTS_CSV: ${{ secrets.SHEET_ACHIEVEMENTS_CSV }}
          SHEET_PLACEMENTS_CSV: ${{ secrets.SHEET_PLACEMENTS_CSV }}
          SHEET_ALUMNI_CSV: ${{ secrets.SHEET_ALUMNI_CSV }}
          SHEET_SETTINGS_CSV: ${{ secrets.SHEET_SETTINGS_CSV }}
          VITE_REPORT_FORM_URL: ${{ secrets.VITE_REPORT_FORM_URL }}
          VITE_REPORT_FORM_FILE_ENTRY: ${{ secrets.VITE_REPORT_FORM_FILE_ENTRY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Admin dashboard (optional; scripts/render-wrangler.mjs adds the bindings when D1_DATABASE_ID is set)
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          # Public alumni form (public value, a GitHub variable): added to the Worker's vars, and to the sitemap
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # Keep the reports (what was indexed, which rows/files were skipped) so a failed run can be diagnosed.
      - name: Save data reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-reports
          path: |
            data/drive-report.md
            data/sheet-report.md
            data/unsorted.csv
          if-no-files-found: ignore
          retention-days: 14

      # Fails the run (so nothing is deployed) if any report still says "fixture" or SITE_URL is not set.
      - name: Refuse to deploy sample data
        run: npm run check:deploy
        env:
          DEPLOY: "1"
          SITE_URL: ${{ secrets.SITE_URL }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      # Applies new files from migrations/ (each runs once) before the new code goes live.
      - name: Apply database migrations
        if: steps.features.outputs.d1 == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: d1 migrations apply DB --remote --config .output/server/wrangler.json

      # Adds the emails in ADMIN_BOOTSTRAP_EMAILS as admins, but only while the admin list is empty (so a
      # removed admin is never re-added). The script validates every email and prints counts only.
      - name: Add the first admins (only while the admin list is empty)
        if: steps.features.outputs.d1 == 'true'
        run: node scripts/bootstrap-admins.mjs
        env:
          ADMIN_BOOTSTRAP_EMAILS: ${{ secrets.ADMIN_BOOTSTRAP_EMAILS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: deploy

      # Public alumni form only: the Worker's two secrets, as encrypted Worker secrets (never in wrangler.json).
      - name: Give the Worker the alumni-form secrets
        if: steps.features.outputs.submissions == 'true'
        run: node scripts/upload-worker-secrets.mjs
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUBMISSION_SALT: ${{ secrets.SUBMISSION_SALT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

