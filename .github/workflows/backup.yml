# Weekly encrypted backup of the admin database (Cloudflare D1). Optional: it does nothing (and succeeds)
# unless the D1_DATABASE_ID secret is set. See docs/OWNERS-START-HERE.md, Part D.
#
#   - every Sunday at 21:00 UTC, or on demand: GitHub -> Actions -> "Back up the admin database" -> Run workflow
#   - the export is compressed and encrypted with BACKUP_PASSPHRASE before it leaves this job; artifacts of a
#     public repository can be downloaded by any signed-in GitHub user, so only the encrypted file is uploaded
#   - kept for 30 days; photos in R2 are NOT part of this backup
#   - the log and summary show only the file size and the number of rows per table

name: Back up the admin database

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Records d1=true/false. Without the secret the remaining steps are skipped and the run succeeds.
      - name: Is the admin database configured?
        id: features
        run: node scripts/check-features.mjs --d1-only
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Export, compress and encrypt the database
        if: steps.features.outputs.d1 == 'true'
        run: node scripts/backup-d1.mjs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Keep the encrypted backup for 30 days
        if: steps.features.outputs.d1 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup/*.sql.gz.enc
          if-no-files-found: error
          retention-days: 30

      - name: Remove local files
        if: always()
        run: rm -rf backup .wrangler/backup
